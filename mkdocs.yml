site_name: LabelWorkshop
site_url: https://labelworkshop.github.io/
site_description: TagStudio port for iOS and iPadOS.
repo_name: LabelWorkshop/ios
repo_url: https://github.com/LabelWorkshop/ios
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting Started: getting_started.md
